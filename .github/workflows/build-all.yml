name: Build sing-box (Android, Windows, Linux)

on:
  workflow_dispatch:
    inputs:
      sing_box_branch:
        description: 'sing-box branch'
        required: true
        default: 'testing'
      version:
        description: 'Version (e.g. 1.13.0-rc.4)'
        required: true
      android_branch:
        description: 'sing-box-for-android branch'
        required: true
        type: string
        default: 'dev'
      enable_naive:
        description: 'Enable naive outbound (requires cronet)'
        required: false
        type: boolean
        default: false

env:
  GO_VERSION: '~1.25.8'
  TAGS_COMMON: 'badlinkname,tfogo_checklinkname0,with_clash_api,with_gvisor,with_quic'
  TAGS_DESKTOP_EXTRA: 'with_acme'
  SING_ANYTLS_VERSION: 'v0.0.11'

jobs:
  build_desktop:
    name: Build ${{ matrix.platform }} (amd64v3)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            goos: linux
            binary: sing-box
            extra_tags: ''
            artifact_name: binary-linux
          - platform: windows
            os: windows-latest
            goos: windows
            binary: sing-box.exe
            extra_tags: ''
            artifact_name: binary-windows
    steps:
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Checkout sing-box
        uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: ${{ github.event.inputs.sing_box_branch }}
          path: sing-box
          fetch-depth: 0

      - name: Set tag
        shell: bash
        run: |
          cd sing-box
          git tag v${{ github.event.inputs.version }} -f

      - name: Apply sing-box patches
        shell: bash
        run: |
          cd sing-box
          curl -sfL https://raw.githubusercontent.com/lurixo/sing-box-releases/patches/sing-box/tcp_keep_alive_count.patch | git apply -v
          curl -sfL https://raw.githubusercontent.com/lurixo/sing-box-releases/patches/sing-box/urltest_unified_delay.patch | git apply -v
          curl -sfL https://raw.githubusercontent.com/lurixo/sing-box-releases/patches/sing-box/reject-unknown-sni.patch | git apply -v
          curl -sfL https://raw.githubusercontent.com/lurixo/sing-box-releases/patches/sing-box/dns_group_transport.patch | git apply -v
          curl -sfL https://raw.githubusercontent.com/lurixo/sing-box-releases/patches/sing-box/anytls_interface_updated.patch | git apply -v

      - name: Patch sing-anytls dependency
        shell: bash
        run: |
          ANYTLS_TAG="${{ env.SING_ANYTLS_VERSION }}"
          mkdir -p /tmp/sing-anytls
          curl -sfL "https://github.com/anytls/sing-anytls/archive/refs/tags/${ANYTLS_TAG}.tar.gz" | tar xz -C /tmp/sing-anytls --strip-components=1

          PATCH_BASE="https://raw.githubusercontent.com/lurixo/sing-box-releases/patches/sing-anytls"
          PATCHES=(
            session-resilience.patch
            sing-anytls-write-deadline.patch
            unknown-cmd-skip-data.patch
            uint16-overflow-protect.patch
            synack-per-stream-timeout.patch
            record-shaper.patch
          )

          # Download all patches
          mkdir -p /tmp/anytls-patches
          for p in "${PATCHES[@]}"; do
            curl -sfL "$PATCH_BASE/$p" -o "/tmp/anytls-patches/$p"
          done

          # Preflight: apply to a temp copy to detect conflicts early
          cp -r /tmp/sing-anytls /tmp/sing-anytls-preflight
          echo "=== Preflight: testing all patches ==="
          cd /tmp/sing-anytls-preflight
          for p in "${PATCHES[@]}"; do
            if ! patch -p1 --no-backup-if-mismatch < "/tmp/anytls-patches/$p"; then
              echo "::error::Patch preflight failed: $p"
              exit 1
            fi
          done
          rm -rf /tmp/sing-anytls-preflight
          echo "=== Preflight passed ==="

          # Apply for real
          cd /tmp/sing-anytls
          for p in "${PATCHES[@]}"; do
            patch -p1 < "/tmp/anytls-patches/$p"
          done

          cd $GITHUB_WORKSPACE/sing-box
          go mod edit -replace "github.com/anytls/sing-anytls@${ANYTLS_TAG}=/tmp/sing-anytls"

      - name: Change URL test default
        shell: bash
        run: |
          sed -i 's|https://www.gstatic.com/generate_204|https://cp.cloudflare.com/generate_204|' sing-box/common/urltest/urltest.go

      - name: Compute build environment
        id: env
        shell: bash
        run: |
          TAGS="${TAGS_COMMON},${TAGS_DESKTOP_EXTRA}${{ matrix.extra_tags }}"
          NAIVE="${{ inputs.enable_naive }}"
          CGO="0"
          ARCHIVE_SUFFIX=""

          if [[ "$NAIVE" == "true" ]]; then
            TAGS="${TAGS},with_naive_outbound"
            # Windows uses purego mode to load cronet at runtime
            if [[ "${{ matrix.platform }}" == "windows" ]]; then
              TAGS="${TAGS},with_purego"
            fi
          fi

          # Linux with naive needs CGO and glibc suffix
          if [[ "${{ matrix.platform }}" == "linux" && "$NAIVE" == "true" ]]; then
            CGO="1"
            ARCHIVE_SUFFIX="-glibc"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "cgo=${CGO}" >> "$GITHUB_OUTPUT"
          echo "naive=${NAIVE}" >> "$GITHUB_OUTPUT"
          echo "archive_suffix=${ARCHIVE_SUFFIX}" >> "$GITHUB_OUTPUT"

          echo "--- Build Environment ---"
          echo "Platform: ${{ matrix.platform }}"
          echo "Tags: ${TAGS}"
          echo "CGO: ${CGO}"
          echo "Naive: ${NAIVE}"
          echo "Archive suffix: ${ARCHIVE_SUFFIX}"

      - name: Clone cronet-go
        if: steps.env.outputs.naive == 'true'
        shell: bash
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat sing-box/.github/CRONET_GO_VERSION)
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          git -C ~/cronet-go fetch --depth=1 origin "$CRONET_GO_VERSION"
          git -C ~/cronet-go checkout FETCH_HEAD

      - name: Init cronet-go submodules
        if: steps.env.outputs.naive == 'true' && matrix.platform == 'linux'
        run: |
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: Regenerate Debian keyring
        if: steps.env.outputs.naive == 'true' && matrix.platform == 'linux'
        run: |
          set -xeuo pipefail
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      - name: Download Chromium toolchain
        if: steps.env.outputs.naive == 'true' && matrix.platform == 'linux'
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/amd64 download-toolchain

      - name: Set Chromium toolchain environment
        if: steps.env.outputs.naive == 'true' && matrix.platform == 'linux'
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/amd64 env >> $GITHUB_ENV

      - name: Build
        shell: bash
        run: |
          set -xeuo pipefail
          cd sing-box
          mkdir -p dist
          go build -v -trimpath -o "dist/${{ matrix.binary }}" \
            -tags "${{ steps.env.outputs.tags }}" \
            -ldflags '-s -buildid= -X github.com/sagernet/sing-box/constant.Version=${{ github.event.inputs.version }} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -checklinkname=0' \
            ./cmd/sing-box
        env:
          CGO_ENABLED: ${{ steps.env.outputs.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          GOAMD64: v3

      - name: Extract libcronet.dll
        if: steps.env.outputs.naive == 'true' && matrix.platform == 'windows'
        shell: bash
        run: |
          cd ~/cronet-go
          CGO_ENABLED=0 go run -v ./cmd/build-naive extract-lib --target windows/amd64 -o "$GITHUB_WORKSPACE/sing-box/dist"

      - name: Archive (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd sing-box/dist
          DIR_NAME="sing-box-${{ github.event.inputs.version }}-linux-amd64v3${{ steps.env.outputs.archive_suffix }}"
          mkdir -p "$DIR_NAME"
          cp ../LICENSE "$DIR_NAME/"
          cp sing-box "$DIR_NAME/"
          tar -czvf "$DIR_NAME.tar.gz" "$DIR_NAME"
          rm -rf "$DIR_NAME" sing-box

      - name: Archive (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cd sing-box/dist
          $DIR_NAME = "sing-box-${{ github.event.inputs.version }}-windows-amd64v3"
          mkdir "$DIR_NAME"
          Copy-Item ../LICENSE "$DIR_NAME/"
          Copy-Item sing-box.exe "$DIR_NAME/"
          if ("${{ steps.env.outputs.naive }}" -eq "true" -and (Test-Path libcronet.dll)) {
            Copy-Item libcronet.dll "$DIR_NAME/"
          }
          Compress-Archive -Path "$DIR_NAME" -DestinationPath "$DIR_NAME.zip"
          Remove-Item -Recurse "$DIR_NAME"
          Remove-Item sing-box.exe
          if (Test-Path libcronet.dll) { Remove-Item libcronet.dll }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: sing-box/dist/*

  build_android:
    name: Build Android (arm64-v8a)
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Setup OpenJDK
        run: |
          sudo apt update && sudo apt install -y openjdk-17-jdk-headless
          /usr/lib/jvm/java-17-openjdk-amd64/bin/java --version

      - name: Checkout sing-box
        uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: ${{ github.event.inputs.sing_box_branch }}
          path: sing-box
          fetch-depth: 0

      - name: Checkout sing-box-for-android
        uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box-for-android
          ref: ${{ github.event.inputs.android_branch }}
          path: sing-box-for-android

      - name: Set tag
        run: |
          cd sing-box
          git tag v${{ github.event.inputs.version }} -f

      - name: Read version code from source
        run: |
          VERSION_CODE=$(grep '^VERSION_CODE=' sing-box-for-android/version.properties | cut -d'=' -f2)
          echo "Read VERSION_CODE from source: $VERSION_CODE"
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Apply sing-box patches
        run: |
          cd sing-box
          curl -sfL https://raw.githubusercontent.com/lurixo/sing-box-releases/patches/sing-box/tcp_keep_alive_count.patch | git apply -v
          curl -sfL https://raw.githubusercontent.com/lurixo/sing-box-releases/patches/sing-box/urltest_unified_delay.patch | git apply -v
          curl -sfL https://raw.githubusercontent.com/lurixo/sing-box-releases/patches/sing-box/reject-unknown-sni.patch | git apply -v
          curl -sfL https://raw.githubusercontent.com/lurixo/sing-box-releases/patches/sing-box/dns_group_transport.patch | git apply -v
          curl -sfL https://raw.githubusercontent.com/lurixo/sing-box-releases/patches/sing-box/libbox_http_timeout.patch | git apply -v
          curl -sfL https://raw.githubusercontent.com/lurixo/sing-box-releases/patches/sing-box/anytls_interface_updated.patch | git apply -v

      - name: Patch sing-anytls dependency
        run: |
          ANYTLS_TAG="${{ env.SING_ANYTLS_VERSION }}"
          mkdir -p /tmp/sing-anytls
          curl -sfL "https://github.com/anytls/sing-anytls/archive/refs/tags/${ANYTLS_TAG}.tar.gz" | tar xz -C /tmp/sing-anytls --strip-components=1

          PATCH_BASE="https://raw.githubusercontent.com/lurixo/sing-box-releases/patches/sing-anytls"
          PATCHES=(
            session-resilience.patch
            sing-anytls-write-deadline.patch
            unknown-cmd-skip-data.patch
            uint16-overflow-protect.patch
            synack-per-stream-timeout.patch
            record-shaper.patch
          )

          # Download all patches
          mkdir -p /tmp/anytls-patches
          for p in "${PATCHES[@]}"; do
            curl -sfL "$PATCH_BASE/$p" -o "/tmp/anytls-patches/$p"
          done

          # Preflight: apply to a temp copy to detect conflicts early
          cp -r /tmp/sing-anytls /tmp/sing-anytls-preflight
          echo "=== Preflight: testing all patches ==="
          cd /tmp/sing-anytls-preflight
          for p in "${PATCHES[@]}"; do
            if ! patch -p1 --no-backup-if-mismatch < "/tmp/anytls-patches/$p"; then
              echo "::error::Patch preflight failed: $p"
              exit 1
            fi
          done
          rm -rf /tmp/sing-anytls-preflight
          echo "=== Preflight passed ==="

          # Apply for real
          cd /tmp/sing-anytls
          for p in "${PATCHES[@]}"; do
            patch -p1 < "/tmp/anytls-patches/$p"
          done

          cd $GITHUB_WORKSPACE/sing-box
          go mod edit -replace "github.com/anytls/sing-anytls@${ANYTLS_TAG}=/tmp/sing-anytls"

      - name: Change URL test default
        run: |
          sed -i 's|https://www.gstatic.com/generate_204|https://cp.cloudflare.com/generate_204|' sing-box/common/urltest/urltest.go

      - name: Compute build tags
        id: env
        run: |
          TAGS="${TAGS_COMMON}"
          if [[ "${{ inputs.enable_naive }}" == "true" ]]; then
            TAGS="${TAGS},with_naive_outbound"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Build tags: ${TAGS}"

      - name: Change update channel
        run: |
          cd sing-box-for-android
          UPDATE_FILE="app/src/github/java/io/nekohasekai/sfa/vendor/GitHubUpdateChecker.kt"
          if [ -f "$UPDATE_FILE" ]; then
            sed -i 's|SagerNet/sing-box|lurixo/sing-box-releases|g' "$UPDATE_FILE"
            echo "Modified update URL:"
            grep "RELEASES_URL" "$UPDATE_FILE" || true
          fi

      - name: Fix update version check
        run: |
          cd sing-box-for-android
          curl -sfL https://raw.githubusercontent.com/lurixo/sing-box-releases/patches/android/update_checker_versioncode.patch | git apply -v

      - name: Fix all main thread ANR issues
        run: |
          cd sing-box-for-android
          curl -sfL https://raw.githubusercontent.com/lurixo/sing-box-releases/patches/android/fix_all_anr.patch | git apply -v

      - name: Fix update dialog dark mode
        run: |
          cd sing-box-for-android
          curl -sfL https://raw.githubusercontent.com/lurixo/sing-box-releases/patches/android/fix_update_dialog_darkmode.patch | git apply -v

      - name: Remove F-Droid features
        run: |
          cd sing-box-for-android
          curl -sfL https://raw.githubusercontent.com/lurixo/sing-box-releases/patches/android/remove_fdroid_features.patch | git apply -v

      - name: Fix IME swipe delete
        run: |
          cd sing-box-for-android
          curl -sfL https://raw.githubusercontent.com/lurixo/sing-box-releases/patches/android/fix_ime_swipe_delete.patch | git apply -v

      - name: Fix Doze wake network reset
        run: |
          cd sing-box-for-android
          curl -sfL https://raw.githubusercontent.com/lurixo/sing-box-releases/patches/android/fix_doze_wake_reset_network.patch | git apply -v

      - name: Reset network on screen on
        run: |
          cd sing-box-for-android
          curl -sfL https://raw.githubusercontent.com/lurixo/sing-box-releases/patches/android/screen_on_reset_network.patch | git apply -v

      - name: Build library
        run: |
          cd sing-box
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile bind -v \
            -target android/arm64 \
            -androidapi 23 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -trimpath \
            -buildvcs=false \
            -tags="${{ steps.env.outputs.tags }}" \
            -ldflags="-X github.com/sagernet/sing-box/constant.Version=${{ github.event.inputs.version }} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -s -w -buildid= -checklinkname=0" \
            ./experimental/libbox
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Verify libbox.aar
        run: |
          cd sing-box
          if [ ! -f "libbox.aar" ]; then
            echo "Error: libbox.aar not found!"
            exit 1
          fi
          ls -lh libbox.aar

      - name: Prepare Android client
        run: |
          mkdir -p sing-box-for-android/app/libs
          cp sing-box/libbox.aar sing-box-for-android/app/libs/

      - name: Update package name
        run: |
          cd sing-box-for-android
          if [ -f "app/build.gradle.kts" ]; then
            GRADLE_FILE="app/build.gradle.kts"
            sed -i 's/applicationId\s*=\s*"io\.nekohasekai\.sfa"/applicationId = "com.android.internal.net"/' "$GRADLE_FILE"
          elif [ -f "app/build.gradle" ]; then
            GRADLE_FILE="app/build.gradle"
            sed -i '/applicationId/s/io\.nekohasekai\.sfa/com.android.internal.net/' "$GRADLE_FILE"
          else
            echo "Error: No build.gradle or build.gradle.kts found!"
            ls -la app/
            exit 1
          fi
          echo "Package name updated:"
          grep -E "applicationId" "$GRADLE_FILE" || true

      - name: Update version
        run: |
          cd sing-box-for-android
          VERSION="${{ github.event.inputs.version }}"
          VERSION_CODE=$(( ($(date +%s) - 1735689600) / 60 ))
          printf 'VERSION_CODE=%s\nVERSION_NAME=%s\nGO_VERSION=%s\n' \
            "$VERSION_CODE" "$VERSION" "${{ env.GO_VERSION }}" > version.properties
          echo "Created version.properties:"
          cat version.properties
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_FILE }}" | base64 -d > sing-box-for-android/app/release.keystore

      - name: Build APK
        run: |
          cd sing-box-for-android
          chmod +x gradlew
          ./gradlew :app:assembleOtherRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.RELEASE_KEY_PASSWORD }}"
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Rename APK and generate metadata
        run: |
          cd sing-box-for-android/app/build/outputs/apk/other/release

          find . -type f -name "*.apk" ! -name "*arm64-v8a*" -delete 2>/dev/null || true

          APK_FILE=$(ls *arm64-v8a*.apk 2>/dev/null | head -n 1 || ls *.apk 2>/dev/null | head -n 1)
          TARGET_NAME="SFA-${{ github.event.inputs.version }}-foss-arm64-v8a.apk"

          if [ -n "$APK_FILE" ]; then
            if [ "$APK_FILE" != "$TARGET_NAME" ]; then
              mv "$APK_FILE" "$TARGET_NAME"
            fi
            echo "APK renamed to: $TARGET_NAME"
          else
            echo "Error: No APK found!"
            exit 1
          fi

          printf '{\n    "version_code": %s,\n    "version_name": "%s"\n}\n' \
            "${{ env.VERSION_CODE }}" "${{ github.event.inputs.version }}" > SFA-version-metadata.json

          echo "Generated metadata:"
          cat SFA-version-metadata.json

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: |
            sing-box-for-android/app/build/outputs/apk/other/release/*.apk
            sing-box-for-android/app/build/outputs/apk/other/release/SFA-version-metadata.json

  publish:
    name: Publish Release
    needs: [build_desktop, build_android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      deployments: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify files
        run: |
          echo "Downloaded files:"
          ls -la dist/
          echo ""
          echo "Metadata content:"
          cat dist/SFA-version-metadata.json

      - name: Compute tags for release notes
        id: tags
        run: |
          DESKTOP="${TAGS_COMMON},${TAGS_DESKTOP_EXTRA}"
          ANDROID="${TAGS_COMMON}"
          if [[ "${{ inputs.enable_naive }}" == "true" ]]; then
            DESKTOP="${DESKTOP},with_naive_outbound"
            ANDROID="${ANDROID},with_naive_outbound"
          fi
          echo "linux=${DESKTOP}" >> "$GITHUB_OUTPUT"
          if [[ "${{ inputs.enable_naive }}" == "true" ]]; then
            echo "windows=${DESKTOP},with_purego" >> "$GITHUB_OUTPUT"
          else
            echo "windows=${DESKTOP}" >> "$GITHUB_OUTPUT"
          fi
          echo "android=${ANDROID}" >> "$GITHUB_OUTPUT"

          if [[ "${{ inputs.enable_naive }}" == "true" ]]; then
            echo "naive_note=naive outbound enabled" >> "$GITHUB_OUTPUT"
          else
            echo "naive_note=naive outbound disabled" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: dev
          path: repo
          fetch-depth: 0

      - name: Cleanup dev branch
        id: cleanup_dev
        run: |
          cd repo
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"

          git checkout --orphan temp
          git rm -rf . 2>/dev/null || true

          git show dev:LICENSE > LICENSE
          git add LICENSE
          git commit -m "add LICENSE"

          mkdir -p .github/workflows
          git show dev:.github/workflows/build-all.yml > .github/workflows/build-all.yml
          git add .github/workflows/build-all.yml
          git commit -m "ci: build-all workflow"

          cat > build-info.json << EOF
          {
            "version": "${{ github.event.inputs.version }}",
            "sing_box_branch": "${{ github.event.inputs.sing_box_branch }}",
            "android_branch": "${{ github.event.inputs.android_branch }}",
            "enable_naive": ${{ inputs.enable_naive }},
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run_id": "${{ github.run_id }}"
          }
          EOF
          git add build-info.json
          git commit -m "build: v${{ github.event.inputs.version }}"

          git branch -M dev
          git push --force origin dev

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare Pages content
        run: |
          cd repo
          mkdir -p /tmp/pages-site
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git show origin/gh-pages:install.sh > /tmp/pages-site/install.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages-site

      - name: Deploy to GitHub Pages
        id: deploy_pages
        uses: actions/deploy-pages@v4

      - name: Delete older releases
        run: |
          echo "Deleting all existing releases and tags..."
          for tag in $(gh release list --repo "$REPO" --json tagName -q '.[].tagName' 2>/dev/null); do
            echo "Deleting release: $tag"
            gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
          done
          echo "Done"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}

      - name: Create Release
        run: |
          cat > /tmp/release-body.md << RELEASE_EOF
          #### Release Notes

          - Built from sing-box branch: \`$SING_BOX_BRANCH\`
          - Android client branch: \`$ANDROID_BRANCH\`
          - Naive outbound: **$NAIVE_NOTE**
          - Android APK: arm64-v8a only (SDK 23)
          - Linux: amd64v3$LINUX_SUFFIX
          - Windows: amd64v3, purego$WINDOWS_SUFFIX

          #### Patches (sing-box)
          - \`tcp_keep_alive_count.patch\`
          - \`urltest_unified_delay.patch\`
          - \`reject-unknown-sni.patch\`
          - \`dns_group_transport.patch\`
          - \`libbox_http_timeout.patch\` _(Android only)_
          - \`anytls_interface_updated.patch\`

          #### Patches (sing-anytls)
          - \`session-resilience.patch\`
          - \`sing-anytls-write-deadline.patch\`
          - \`unknown-cmd-skip-data.patch\`
          - \`uint16-overflow-protect.patch\`
          - \`synack-per-stream-timeout.patch\`
          - \`record-shaper.patch\` _(TLS record-level traffic shaping with configurable distribution; replaces upstream frame-level padding)_

          #### Patches (Android)
          - \`update_checker_versioncode.patch\`
          - \`fix_all_anr.patch\`
          - \`fix_update_dialog_darkmode.patch\`
          - \`remove_fdroid_features.patch\`
          - \`fix_ime_swipe_delete.patch\`
          - \`fix_doze_wake_reset_network.patch\`
          - \`screen_on_reset_network.patch\`

          #### Other
          - URL test default changed to \`cp.cloudflare.com/generate_204\`
          - Update channel changed to \`lurixo/sing-box-releases\` (Android only)

          #### Build Tags
          - **Linux:** \`$TAGS_LINUX\`
          - **Windows:** \`$TAGS_WINDOWS\`
          - **Android:** \`$TAGS_ANDROID\`
          RELEASE_EOF

          sed -i 's/^          //' /tmp/release-body.md

          gh release create "v$VERSION" \
            --repo "$REPO" \
            --title "$VERSION" \
            --target "$TARGET_SHA" \
            --notes-file /tmp/release-body.md \
            --prerelease \
            dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ github.event.inputs.version }}
          TARGET_SHA: ${{ steps.cleanup_dev.outputs.sha }}
          SING_BOX_BRANCH: ${{ github.event.inputs.sing_box_branch }}
          ANDROID_BRANCH: ${{ github.event.inputs.android_branch }}
          NAIVE_NOTE: ${{ steps.tags.outputs.naive_note }}
          LINUX_SUFFIX: ${{ inputs.enable_naive && ', glibc + Chromium toolchain' || '' }}
          WINDOWS_SUFFIX: ${{ inputs.enable_naive && ' + libcronet.dll' || '' }}
          TAGS_LINUX: ${{ steps.tags.outputs.linux }}
          TAGS_WINDOWS: ${{ steps.tags.outputs.windows }}
          TAGS_ANDROID: ${{ steps.tags.outputs.android }}

      # === Cleanup: only runs after deploy + release both succeed ===

      - name: Delete old Pages deployments
        continue-on-error: true
        run: |
          echo "Cleaning up old GitHub Pages deployments..."
          ALL_IDS=$(gh api --paginate "repos/$REPO/deployments?environment=github-pages&per_page=100" \
            --jq '.[].id')
          OLD_IDS=$(echo "$ALL_IDS" | tail -n +2)
          COUNT=$(echo "$OLD_IDS" | grep -c . || true)
          echo "Found $COUNT old deployment(s) to clean up"

          for id in $OLD_IDS; do
            echo "Processing deployment $id..."
            gh api "repos/$REPO/deployments/$id/statuses" \
              -f state=inactive -f description="Superseded" || echo "  Warning: failed to set inactive for $id"
            gh api "repos/$REPO/deployments/$id" -X DELETE || echo "  Warning: failed to delete $id"
            echo "  Deleted deployment: $id"
          done
          echo "Cleanup complete"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}

      - name: Sync gh-pages branch
        continue-on-error: true
        run: |
          cd repo
          git checkout --orphan temp
          git rm -rf . 2>/dev/null || true

          cp /tmp/pages-site/install.sh install.sh
          git add install.sh
          git commit -m "page: install.sh"

          git branch -M gh-pages
          git push --force origin gh-pages

      - name: Cleanup patches branch
        continue-on-error: true
        run: |
          cd repo
          git fetch origin patches
          git checkout patches
          git checkout --orphan temp
          git rm -rf . 2>/dev/null || true

          for f in $(git ls-tree -r --name-only patches -- sing-box/); do
            mkdir -p "$(dirname "$f")"
            git show "patches:$f" > "$f"
            git add "$f"
            git commit -m "patch(sing-box): $(basename $f .patch)"
          done

          for f in $(git ls-tree -r --name-only patches -- sing-anytls/); do
            mkdir -p "$(dirname "$f")"
            git show "patches:$f" > "$f"
            git add "$f"
            git commit -m "patch(sing-anytls): $(basename $f .patch)"
          done

          for f in $(git ls-tree -r --name-only patches -- android/); do
            mkdir -p "$(dirname "$f")"
            git show "patches:$f" > "$f"
            git add "$f"
            git commit -m "patch(android): $(basename $f .patch)"
          done

          # Commit any remaining files (outdated/, pr/, etc.)
          for f in $(git ls-tree -r --name-only patches | grep -v '^sing-box/' | grep -v '^sing-anytls/' | grep -v '^android/'); do
            mkdir -p "$(dirname "$f")"
            git show "patches:$f" > "$f"
          done
          git add -A
          git diff --cached --quiet || git commit -m "build: v${{ github.event.inputs.version }}"

          git branch -M patches
          git push --force origin patches

      - name: Delete old workflow runs
        continue-on-error: true
        run: |
          echo "Cleaning up old workflow runs..."
          CURRENT_RUN="${{ github.run_id }}"
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[].id' | while read run_id; do
            if [ "$run_id" = "$CURRENT_RUN" ]; then
              echo "Skipping current run: $run_id"
              continue
            fi
            gh api "repos/$REPO/actions/runs/$run_id" -X DELETE || echo "  Warning: failed to delete run $run_id"
            echo "Deleted run: $run_id"
          done
          echo "Cleanup complete"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
