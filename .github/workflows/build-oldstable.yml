name: Build sing-box oldstable (Android, Windows, Linux, Darwin)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.13.0-rc.4)'
        required: true
      publish_release:
        description: 'Publish type after build'
        required: false
        type: choice
        options:
          - none
          - pre-release
          - release
        default: none

env:
  GO_VERSION: '~1.25.8'
  TAGS_COMMON: 'with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_tailscale'
  TAGS_CLI_EXTRA: 'with_dhcp,with_acme'
  TAGS_SFA_EXTRA: 'with_conntrack'

jobs:
  build_cli:
    name: Build CLI ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: arm64
            os: ubuntu-latest
            goos: linux
            goarch: arm64
            goamd64: ''
            binary: sing-box
            extra_tags: ''
            artifact_name: binary-linux-arm64
          - platform: linux
            arch: amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            goamd64: v1
            binary: sing-box
            extra_tags: ''
            artifact_name: binary-linux-amd64
          - platform: linux
            arch: amd64v3
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            goamd64: v3
            binary: sing-box
            extra_tags: ''
            artifact_name: binary-linux-amd64v3
          - platform: windows
            arch: arm64
            os: windows-latest
            goos: windows
            goarch: arm64
            goamd64: ''
            binary: sing-box.exe
            extra_tags: ''
            artifact_name: binary-windows-arm64
          - platform: windows
            arch: amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            goamd64: v1
            binary: sing-box.exe
            extra_tags: ''
            artifact_name: binary-windows-amd64
          - platform: windows
            arch: amd64v3
            os: windows-latest
            goos: windows
            goarch: amd64
            goamd64: v3
            binary: sing-box.exe
            extra_tags: ''
            artifact_name: binary-windows-amd64v3
          - platform: darwin
            arch: arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            goamd64: ''
            binary: sing-box
            extra_tags: ''
            artifact_name: binary-darwin-arm64
          - platform: darwin
            arch: amd64
            os: macos-latest
            goos: darwin
            goarch: amd64
            goamd64: v1
            binary: sing-box
            extra_tags: ''
            artifact_name: binary-darwin-amd64
          - platform: darwin
            arch: amd64v3
            os: macos-latest
            goos: darwin
            goarch: amd64
            goamd64: v3
            binary: sing-box
            extra_tags: ''
            artifact_name: binary-darwin-amd64v3
            cgo: '0'
            cc_triple: ''
          - platform: android
            arch: 386
            os: ubuntu-latest
            goos: android
            goarch: 386
            goamd64: ''
            goarm: ''
            binary: sing-box
            extra_tags: ''
            artifact_name: binary-android-386
            cgo: '1'
            cc_triple: 'i686-linux-android35-clang'
          - platform: android
            arch: amd64
            os: ubuntu-latest
            goos: android
            goarch: amd64
            goamd64: v1
            goarm: ''
            binary: sing-box
            extra_tags: ''
            artifact_name: binary-android-amd64
            cgo: '1'
            cc_triple: 'x86_64-linux-android35-clang'
          - platform: android
            arch: amd64v3
            os: ubuntu-latest
            goos: android
            goarch: amd64
            goamd64: v3
            goarm: ''
            binary: sing-box
            extra_tags: ''
            artifact_name: binary-android-amd64v3
            cgo: '1'
            cc_triple: 'x86_64-linux-android35-clang'
          - platform: android
            arch: arm
            os: ubuntu-latest
            goos: android
            goarch: arm
            goamd64: ''
            goarm: '7'
            binary: sing-box
            extra_tags: ''
            artifact_name: binary-android-arm
            cgo: '1'
            cc_triple: 'armv7a-linux-androideabi35-clang'
          - platform: android
            arch: arm64
            os: ubuntu-latest
            goos: android
            goarch: arm64
            goamd64: ''
            goarm: ''
            binary: sing-box
            extra_tags: ''
            artifact_name: binary-android-arm64
            cgo: '1'
            cc_triple: 'aarch64-linux-android35-clang'
    steps:
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Checkout sing-box
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: v${{ github.event.inputs.version }}
          path: sing-box
          fetch-depth: 0

      - name: Setup Android NDK
        if: matrix.platform == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Compute build environment
        id: env
        shell: bash
        run: |
          TAGS="${TAGS_COMMON},${TAGS_CLI_EXTRA}${{ matrix.extra_tags }}"
          CGO="${{ matrix.cgo || '0' }}"

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "cgo=${CGO}" >> "$GITHUB_OUTPUT"

          echo "--- Build Environment ---"
          echo "Platform: ${{ matrix.platform }}"
          echo "Arch: ${{ matrix.arch }}"
          echo "Tags: ${TAGS}"
          echo "CGO: ${CGO}"

      - name: Build
        shell: bash
        run: |
          set -xeuo pipefail
          cd sing-box
          mkdir -p dist
          go build -v -trimpath -o "dist/${{ matrix.binary }}" \
            -tags "${{ steps.env.outputs.tags }}" \
            -ldflags '-s -buildid= -X github.com/sagernet/sing-box/constant.Version=${{ github.event.inputs.version }}' \
            ./cmd/sing-box
        env:
          CGO_ENABLED: ${{ steps.env.outputs.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
          GOARM: ${{ matrix.goarm }}
          CC: ${{ matrix.cc_triple && format('{0}/toolchains/llvm/prebuilt/linux-x86_64/bin/{1}', steps.setup-ndk.outputs.ndk-path, matrix.cc_triple) || '' }}

      - name: Archive (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd sing-box/dist
          DIR_NAME="sing-box-${{ github.event.inputs.version }}-linux-${{ matrix.arch }}"
          mkdir -p "$DIR_NAME"
          cp ../LICENSE "$DIR_NAME/"
          cp sing-box "$DIR_NAME/"
          tar -czvf "$DIR_NAME.tar.gz" "$DIR_NAME"
          rm -rf "$DIR_NAME" sing-box

      - name: Archive (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cd sing-box/dist
          $DIR_NAME = "sing-box-${{ github.event.inputs.version }}-windows-${{ matrix.arch }}"
          mkdir "$DIR_NAME"
          Copy-Item ../LICENSE "$DIR_NAME/"
          Copy-Item sing-box.exe "$DIR_NAME/"
          Compress-Archive -Path "$DIR_NAME" -DestinationPath "$DIR_NAME.zip"
          Remove-Item -Recurse "$DIR_NAME"
          Remove-Item sing-box.exe

      - name: Archive (Darwin)
        if: matrix.platform == 'darwin'
        run: |
          cd sing-box/dist
          DIR_NAME="sing-box-${{ github.event.inputs.version }}-darwin-${{ matrix.arch }}"
          mkdir -p "$DIR_NAME"
          cp ../LICENSE "$DIR_NAME/"
          cp sing-box "$DIR_NAME/"
          tar -czvf "$DIR_NAME.tar.gz" "$DIR_NAME"
          rm -rf "$DIR_NAME" sing-box

      - name: Archive (Android)
        if: matrix.platform == 'android'
        run: |
          cd sing-box/dist
          DIR_NAME="sing-box-${{ github.event.inputs.version }}-android-${{ matrix.arch }}"
          mkdir -p "$DIR_NAME"
          cp ../LICENSE "$DIR_NAME/"
          cp sing-box "$DIR_NAME/"
          tar -czvf "$DIR_NAME.tar.gz" "$DIR_NAME"
          rm -rf "$DIR_NAME" sing-box

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: sing-box/dist/*

  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Setup OpenJDK
        run: |
          sudo apt update && sudo apt install -y openjdk-17-jdk-headless
          /usr/lib/jvm/java-17-openjdk-amd64/bin/java --version

      - name: Checkout sing-box
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: v${{ github.event.inputs.version }}
          path: sing-box
          fetch-depth: 0

      - name: Checkout sing-box-for-android
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box-for-android
          ref: reF1nd-oldstable
          path: sing-box-for-android

      - name: Compute build tags
        id: env
        run: |
          TAGS="${TAGS_COMMON},${TAGS_SFA_EXTRA}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Build tags: ${TAGS}"

      - name: Build library
        run: |
          cd sing-box
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile bind -v \
            -target android \
            -androidapi 21 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -trimpath \
            -buildvcs=false \
            -tags="${{ steps.env.outputs.tags }}" \
            -ldflags="-X github.com/sagernet/sing-box/constant.Version=${{ github.event.inputs.version }} -s -w -buildid= -checklinkname=0" \
            ./experimental/libbox
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Verify libbox.aar
        run: |
          cd sing-box
          if [ ! -f "libbox.aar" ]; then
            echo "Error: libbox.aar not found!"
            exit 1
          fi
          ls -lh libbox.aar

      - name: Prepare Android client
        run: |
          mkdir -p sing-box-for-android/app/libs
          cp sing-box/libbox.aar sing-box-for-android/app/libs/

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_FILE }}" | base64 -d > sing-box-for-android/app/release.keystore

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle') }}

      - name: Build APK
        run: |
          cd sing-box-for-android
          chmod +x gradlew
          ./gradlew :app:assembleOtherRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.RELEASE_KEY_PASSWORD }}"
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: |
            sing-box-for-android/app/build/outputs/apk/other/release/*.apk

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build_cli, build_android]
    if: ${{ github.event.inputs.publish_release != 'none' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate oldstable-build-info.json
        run: |
          jq \
            --arg version "${{ github.event.inputs.version }}" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_id "${{ github.run_id }}" \
            '.version = $version | .built_at = $built_at | .run_id = $run_id' \
            oldstable-build-info.json > updated-oldstable-build-info.json
          mv updated-oldstable-build-info.json oldstable-build-info.json

          VERSION=$(jq -r '.version' oldstable-build-info.json)
          BUILT_AT=$(jq -r '.built_at' oldstable-build-info.json)
          RUN_ID=$(jq -r '.run_id' oldstable-build-info.json)

          {
            echo "## sing-box v${VERSION}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| sing-box Branch | [\`reF1nd-oldstable\`](https://github.com/reF1nd/sing-box/tree/reF1nd-oldstable) |"
            echo "| Built At | ${BUILT_AT} |"
            echo "| Run ID | [${RUN_ID}](https://github.com/${{ github.repository }}/actions/runs/${RUN_ID}) |"
          } > release-notes.md

      - name: Commit updated build-info
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add oldstable-build-info.json
          git commit -m "Release v${{ github.event.inputs.version }}"
          git push

      - name: Delete existing tag and release if exists
        run: |
          TAG="v${{ github.event.inputs.version }}"
          # 删除已有 Release（若存在）
          RELEASE_ID=$(gh release view "$TAG" --json id -q '.id' 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ]; then
            gh release delete "$TAG" --yes
          fi
          # 删除已有 tag（若存在）
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            git push origin ":refs/tags/$TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect release files
        run: |
          mkdir -p release_files
          find artifacts -type f | while read -r f; do
            cp "$f" release_files/
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          prerelease: ${{ github.event.inputs.publish_release == 'pre-release' }}
          body_path: release-notes.md
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Organize release files
        run: |
          mkdir -p release_files/sfa release_files/android release_files/others
          mv release_files/SFA-* release_files/sfa/ 2>/dev/null || true
          mv release_files/sing-box-*-android-* release_files/android/ 2>/dev/null || true
          mv release_files/sing-box-* release_files/others/ 2>/dev/null || true

      - name: Post SFA to channel
        uses: xireiki/channel-post@v1
        with: 
          chat_id: ${{ secrets.CHAT_ID }}
          bot_token: ${{ secrets.BOT_TOKEN }}
          path: release_files/sfa/*
          context: "#oldstable\nSFA-${{ github.event.inputs.version }}"
          parse_mode: HTML
          large_file: true
          api_id: ${{ secrets.API_ID }}
          api_hash: ${{ secrets.API_HASH }}
          method: sendFile

      - name: Kill telegram-bot-api between posts
        run: pkill -f telegram-bot-api || true

      - name: Post sing-box-android to channel
        uses: xireiki/channel-post@v1
        with: 
          chat_id: ${{ secrets.CHAT_ID }}
          bot_token: ${{ secrets.BOT_TOKEN }}
          path: release_files/android/*
          context: "#oldstable\nsing-box-${{ github.event.inputs.version }}-android"
          parse_mode: HTML
          large_file: true
          api_id: ${{ secrets.API_ID }}
          api_hash: ${{ secrets.API_HASH }}
          method: sendFile

      - name: Kill telegram-bot-api between posts
        run: pkill -f telegram-bot-api || true

      - name: Post sing-box to channel
        uses: xireiki/channel-post@v1
        with: 
          chat_id: ${{ secrets.CHAT_ID }}
          bot_token: ${{ secrets.BOT_TOKEN }}
          path: release_files/others/*
          context: "#oldstable\nsing-box-${{ github.event.inputs.version }}"
          parse_mode: HTML
          large_file: true
          api_id: ${{ secrets.API_ID }}
          api_hash: ${{ secrets.API_HASH }}
          method: sendFile
