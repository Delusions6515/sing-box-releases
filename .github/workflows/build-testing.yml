name: Build sing-box testing (Android, Windows, Linux, Darwin)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag or temporary tag when building from commit hash (e.g. 1.13.0-rc.4)'
        required: true
      commit_hash:
        description: 'Optional commit hash to build from (overrides version tag)'
        required: false
        default: ''
      publish_release:
        description: 'Publish type after build'
        required: false
        type: choice
        options:
          - none
          - pre-release
          - release
        default: none
      build_cli:
        description: 'Build CLI'
        required: false
        type: boolean
        default: true
      build_android_gui:
        description: 'Build Android'
        required: false
        type: boolean
        default: true
      build_windows_gui:
        description: 'Build Windows GUI'
        required: false
        type: boolean
        default: true

env:
  GO_VERSION: '~1.25.11'
  GO_VERSION_DARWIN: '^1.25.3'
  TAGS_COMMON: 'with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0,with_tailscale'
  TAGS_CLI_EXTRA: 'with_dhcp,with_acme,with_ccm,with_ocm,with_cloudflared'
  TAGS_SFA_EXTRA: 'ts_omit_logtail,ts_omit_ssh,ts_omit_drive,ts_omit_taildrop,ts_omit_webclient,ts_omit_doctor,ts_omit_capture,ts_omit_kube,ts_omit_aws,ts_omit_synology,ts_omit_bird'

jobs:
  build_cli:
    if: ${{ github.event.inputs.build_cli == 'true' }}
    name: Build CLI ${{ matrix.platform }}-${{ matrix.arch }} ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: arm64
            os: ubuntu-latest
            goos: linux
            goarch: arm64
            goamd64: ''
            binary: sing-box
            extra_tags: ',with_purego'
            variant: purego
            artifact_name: binary-linux-arm64-purego
            naive: true
          - platform: linux
            arch: arm64
            os: ubuntu-latest
            goos: linux
            goarch: arm64
            goamd64: ''
            binary: sing-box
            extra_tags: ''
            variant: glibc
            artifact_name: binary-linux-arm64-glibc
            cgo: '1'
            naive: true
          - platform: linux
            arch: arm64
            os: ubuntu-latest
            goos: linux
            goarch: arm64
            goamd64: ''
            binary: sing-box
            extra_tags: ',with_musl'
            variant: musl
            artifact_name: binary-linux-arm64-musl
            cgo: '1'
            naive: true
          - platform: linux
            arch: amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            goamd64: v1
            binary: sing-box
            extra_tags: ',with_purego'
            variant: purego
            artifact_name: binary-linux-amd64-purego
            naive: true
          - platform: linux
            arch: amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            goamd64: v1
            binary: sing-box
            extra_tags: ''
            variant: glibc
            artifact_name: binary-linux-amd64-glibc
            cgo: '1'
            naive: true
          - platform: linux
            arch: amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            goamd64: v1
            binary: sing-box
            extra_tags: ',with_musl'
            variant: musl
            artifact_name: binary-linux-amd64-musl
            cgo: '1'
            naive: true
          - platform: linux
            arch: amd64v3
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            goamd64: v3
            binary: sing-box
            extra_tags: ',with_purego'
            variant: purego
            artifact_name: binary-linux-amd64v3-purego
            naive: true
          - platform: linux
            arch: amd64v3
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            goamd64: v3
            binary: sing-box
            extra_tags: ''
            variant: glibc
            artifact_name: binary-linux-amd64v3-glibc
            cgo: '1'
            naive: true
          - platform: linux
            arch: amd64v3
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            goamd64: v3
            binary: sing-box
            extra_tags: ',with_musl'
            variant: musl
            artifact_name: binary-linux-amd64v3-musl
            cgo: '1'
            naive: true
          - platform: windows
            arch: arm64
            os: windows-latest
            goos: windows
            goarch: arm64
            goamd64: ''
            binary: sing-box.exe
            extra_tags: ',with_purego'
            variant: purego
            artifact_name: binary-windows-arm64
            naive: true
          - platform: windows
            arch: amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            goamd64: v1
            binary: sing-box.exe
            extra_tags: ',with_purego'
            variant: purego
            artifact_name: binary-windows-amd64
            naive: true
          - platform: windows
            arch: amd64v3
            os: windows-latest
            goos: windows
            goarch: amd64
            goamd64: v3
            binary: sing-box.exe
            extra_tags: ',with_purego'
            variant: purego
            artifact_name: binary-windows-amd64v3
            naive: true
          - platform: darwin
            arch: arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            goamd64: ''
            binary: sing-box
            extra_tags: ''
            artifact_name: binary-darwin-arm64
            cgo: '1'
            naive: true
          - platform: darwin
            arch: amd64
            os: macos-latest
            goos: darwin
            goarch: amd64
            goamd64: v1
            binary: sing-box
            extra_tags: ''
            artifact_name: binary-darwin-amd64
            cgo: '1'
            naive: true
          - platform: darwin
            arch: amd64v3
            os: macos-latest
            goos: darwin
            goarch: amd64
            goamd64: v3
            binary: sing-box
            extra_tags: ''
            artifact_name: binary-darwin-amd64v3
            cgo: '1'
            naive: true
          - platform: android
            arch: 386
            os: ubuntu-latest
            goos: android
            goarch: 386
            goamd64: ''
            binary: sing-box
            extra_tags: ''
            artifact_name: binary-android-386
            cgo: '1'
            cc_triple: 'i686-linux-android23'
            naive: true
          - platform: android
            arch: amd64
            os: ubuntu-latest
            goos: android
            goarch: amd64
            goamd64: v1
            binary: sing-box
            extra_tags: ''
            artifact_name: binary-android-amd64
            cgo: '1'
            cc_triple: 'x86_64-linux-android23'
            naive: true
          - platform: android
            arch: amd64v3
            os: ubuntu-latest
            goos: android
            goarch: amd64
            goamd64: v3
            binary: sing-box
            extra_tags: ''
            artifact_name: binary-android-amd64v3
            cgo: '1'
            cc_triple: 'x86_64-linux-android23'
            naive: true
          - platform: android
            arch: arm
            os: ubuntu-latest
            goos: android
            goarch: arm
            goamd64: ''
            binary: sing-box
            extra_tags: ''
            artifact_name: binary-android-arm
            cgo: '1'
            cc_triple: 'armv7a-linux-androideabi23'
            naive: true
          - platform: android
            arch: arm64
            os: ubuntu-latest
            goos: android
            goarch: arm64
            goamd64: ''
            binary: sing-box
            extra_tags: ''
            artifact_name: binary-android-arm64
            cgo: '1'
            cc_triple: 'aarch64-linux-android23'
            naive: true
    steps:
      - name: Setup Go for Darwin
        if: matrix.platform == 'darwin'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION_DARWIN }}
          cache: false

      - name: Setup Go
        if: matrix.platform != 'darwin'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Checkout sing-box
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ github.event.inputs.commit_hash != '' && github.event.inputs.commit_hash || format('v{0}', github.event.inputs.version) }}
          path: sing-box
          fetch-depth: 0

      - name: Recreate temporary tag
        if: github.event.inputs.commit_hash != ''
        shell: bash
        run: |
          set -xeuo pipefail
          cd sing-box
          TAG="v${{ github.event.inputs.version }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git tag -d "${TAG}"
          fi
          git tag "${TAG}" "${{ github.event.inputs.commit_hash }}"

      - name: Setup Android NDK
        if: matrix.platform == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          #local-cache: true

      - name: Clone cronet-go
        if: matrix.variant == 'glibc' || matrix.variant == 'musl' || matrix.variant == 'purego'
        shell: bash
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat sing-box/.github/CRONET_GO_VERSION)
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          git -C ~/cronet-go fetch --depth=1 origin "$CRONET_GO_VERSION"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: Regenerate Debian keyring
        if: matrix.variant == 'glibc' || matrix.variant == 'musl'
        shell: bash
        run: |
          set -xeuo pipefail
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      - name: Cache Chromium toolchain
        if: matrix.variant == 'glibc' || matrix.variant == 'musl'
        id: cache-chromium-toolchain
        uses: actions/cache@v5
        with:
          path: |
            ~/cronet-go/naiveproxy/src/third_party/llvm-build/
            ~/cronet-go/naiveproxy/src/gn/out/
            ~/cronet-go/naiveproxy/src/chrome/build/pgo_profiles/
            ~/cronet-go/naiveproxy/src/out/sysroot-build/
          key: chromium-toolchain-${{ matrix.goarch }}-${{ matrix.variant }}-${{ hashFiles('sing-box/.github/CRONET_GO_VERSION') }}

      - name: Download Chromium toolchain
        if: matrix.variant == 'glibc' || matrix.variant == 'musl'
        shell: bash
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          if [[ "${{ matrix.variant }}" == "musl" ]]; then
            go run ./cmd/build-naive --target=linux/${{ matrix.goarch }} --libc=musl download-toolchain
          else
            go run ./cmd/build-naive --target=linux/${{ matrix.goarch }} download-toolchain
          fi

      - name: Set Chromium toolchain environment
        if: matrix.variant == 'glibc' || matrix.variant == 'musl'
        shell: bash
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          if [[ "${{ matrix.variant }}" == "musl" ]]; then
            go run ./cmd/build-naive --target=linux/${{ matrix.goarch }} --libc=musl env >> $GITHUB_ENV
          else
            go run ./cmd/build-naive --target=linux/${{ matrix.goarch }} env >> $GITHUB_ENV
          fi

      - name: Compute build environment
        id: env
        shell: bash
        run: |
          TAGS="${TAGS_COMMON},${TAGS_CLI_EXTRA}${{ matrix.extra_tags }}"
          ARCHIVE_SUFFIX=""

          if [[ "${{ matrix.naive }}" == "true" ]]; then
            TAGS="${TAGS},with_naive_outbound"
          fi

          case "${{ matrix.variant }}" in
            'glibc')
              ARCHIVE_SUFFIX="-glibc"
              ;;
            'musl')
              ARCHIVE_SUFFIX="-musl"
              ;;
          esac
          if [[ "${{ matrix.variant }}" == "purego" && "${{ matrix.platform }}" == "linux" ]]; then
              ARCHIVE_SUFFIX="-purego"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "archive_suffix=${ARCHIVE_SUFFIX}" >> "$GITHUB_OUTPUT"

          echo "--- Build Environment ---"
          echo "Platform: ${{ matrix.platform }}"
          echo "Arch: ${{ matrix.arch }}"
          echo "Tags: ${TAGS}"
          echo "Archive suffix: ${ARCHIVE_SUFFIX}"

      - name: Build
        shell: bash
        run: |
          set -xeuo pipefail
          cd sing-box
          mkdir -p dist
          if [[ -n "${{ matrix.cc_triple }}" ]]; then
            export CC="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cc_triple }}-clang"
          fi
          go build -v -trimpath -o "dist/${{ matrix.binary }}" \
            -tags "${{ steps.env.outputs.tags }}" \
            -ldflags '-s -buildid= -X github.com/sagernet/sing-box/constant.Version=${{ github.event.inputs.version }} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -checklinkname=0' \
            ./cmd/sing-box
        env:
          CGO_ENABLED: ${{ matrix.cgo || '0' }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}

      - name: Extract libcronet.so
        if: matrix.variant == 'purego' && matrix.platform == 'linux'
        shell: bash
        run: |
          cd ~/cronet-go
          CGO_ENABLED=0 go run -v ./cmd/build-naive extract-lib --target linux/${{ matrix.goarch }} -o "$GITHUB_WORKSPACE/sing-box/dist"

      - name: Extract libcronet.dll
        if: matrix.variant == 'purego' && matrix.platform == 'windows'
        shell: bash
        run: |
          cd ~/cronet-go
          CGO_ENABLED=0 go run -v ./cmd/build-naive extract-lib --target windows/${{ matrix.goarch }} -o "$GITHUB_WORKSPACE/sing-box/dist"

      - name: Archive (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cd sing-box/dist
          DIR_NAME="sing-box-${{ github.event.inputs.version }}-linux-${{ matrix.arch }}${{ steps.env.outputs.archive_suffix }}"
          mkdir -p "$DIR_NAME"
          cp ../LICENSE "$DIR_NAME/"
          cp sing-box "$DIR_NAME/"
          if [ -f libcronet.so ]; then
              cp libcronet.so "${DIR_NAME}"
          fi
          tar -czvf "$DIR_NAME.tar.gz" "$DIR_NAME"
          rm -rf "$DIR_NAME" sing-box
          if [ -f libcronet.so ]; then rm -f libcronet.so; fi

      - name: Archive (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cd sing-box/dist
          $DIR_NAME = "sing-box-${{ github.event.inputs.version }}-windows-${{ matrix.arch }}"
          mkdir "$DIR_NAME"
          Copy-Item ../LICENSE "$DIR_NAME/"
          Copy-Item sing-box.exe "$DIR_NAME/"
          if (Test-Path libcronet.dll) {
              Copy-Item libcronet.dll "$DIR_NAME/"
          }
          Compress-Archive -Path "$DIR_NAME" -DestinationPath "$DIR_NAME.zip"
          Remove-Item -Recurse "$DIR_NAME"
          Remove-Item sing-box.exe
          if (Test-Path libcronet.dll) { Remove-Item libcronet.dll }

      - name: Archive (Darwin)
        if: matrix.platform == 'darwin'
        run: |
          cd sing-box/dist
          DIR_NAME="sing-box-${{ github.event.inputs.version }}-darwin-${{ matrix.arch }}"
          mkdir -p "$DIR_NAME"
          cp ../LICENSE "$DIR_NAME/"
          cp sing-box "$DIR_NAME/"
          tar -czvf "$DIR_NAME.tar.gz" "$DIR_NAME"
          rm -rf "$DIR_NAME" sing-box

      - name: Archive (Android)
        if: matrix.platform == 'android'
        run: |
          cd sing-box/dist
          DIR_NAME="sing-box-${{ github.event.inputs.version }}-android-${{ matrix.arch }}"
          mkdir -p "$DIR_NAME"
          cp ../LICENSE "$DIR_NAME/"
          cp sing-box "$DIR_NAME/"
          tar -czvf "$DIR_NAME.tar.gz" "$DIR_NAME"
          rm -rf "$DIR_NAME" sing-box

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: sing-box/dist/*

  build_android:
    if: ${{ github.event.inputs.build_android_gui == 'true' }}
    name: Build Android
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Setup OpenJDK
        run: |
          sudo apt update && sudo apt install -y openjdk-17-jdk-headless
          /usr/lib/jvm/java-17-openjdk-amd64/bin/java --version

      - name: Checkout sing-box
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ github.event.inputs.commit_hash != '' && github.event.inputs.commit_hash || format('v{0}', github.event.inputs.version) }}
          path: sing-box
          fetch-depth: 0

      - name: Recreate temporary tag
        if: github.event.inputs.commit_hash != ''
        shell: bash
        run: |
          set -xeuo pipefail
          cd sing-box
          TAG="v${{ github.event.inputs.version }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git tag -d "${TAG}"
          fi
          git tag "${TAG}" "${{ github.event.inputs.commit_hash }}"

      - name: Checkout sing-box-for-android
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box-for-android
          ref: reF1nd-testing
          path: sing-box-for-android

      - name: Checkout submodule recursive
        run: |
          cd sing-box-for-android
          git submodule update --init --recursive -v

      - name: Update VERSION_NAME for temporary tag
        if: github.event.inputs.commit_hash != ''
        shell: bash
        run: |
          set -xeuo pipefail
          FILE="sing-box-for-android/version.properties"
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${{ github.event.inputs.version }}/" "$FILE"
          grep '^VERSION_NAME=' "$FILE"

      - name: Read version code from source
        run: |
          VERSION_CODE=$(grep '^VERSION_CODE=' sing-box-for-android/version.properties | cut -d'=' -f2)
          echo "Read VERSION_CODE from source: $VERSION_CODE"
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Compute build tags
        id: env
        run: |
          TAGS="${TAGS_COMMON},${TAGS_SFA_EXTRA}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Build tags: ${TAGS}"

      - name: Build library
        run: |
          cd sing-box
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile bind -v \
            -o libbox.aar \
            -target android \
            -androidapi 23 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -trimpath \
            -buildvcs=false \
            -tags="${{ steps.env.outputs.tags }},with_naive_outbound" \
            -ldflags="-X github.com/sagernet/sing-box/constant.Version=${{ github.event.inputs.version }} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -s -w -buildid= -checklinkname=0" \
            ./experimental/libbox
          gomobile bind -v \
            -o libbox-legacy.aar \
            -target android \
            -androidapi 21 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -trimpath \
            -buildvcs=false \
            -tags="${{ steps.env.outputs.tags }}" \
            -ldflags="-X github.com/sagernet/sing-box/constant.Version=${{ github.event.inputs.version }} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -s -w -buildid= -checklinkname=0" \
            ./experimental/libbox
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Verify libbox.aar
        run: |
          cd sing-box
          if [ ! -f "libbox.aar" ]; then
            echo "Error: libbox.aar not found!"
            exit 1
          fi
          if [ ! -f "libbox-legacy.aar" ]; then
            echo "Error: libbox-legacy.aar not found!"
            exit 1
          fi
          ls -lh libbox.aar libbox-legacy.aar

      - name: Prepare Android client
        run: |
          mkdir -p sing-box-for-android/app/libs
          cp sing-box/*.aar sing-box-for-android/app/libs/

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_FILE }}" | base64 -d > sing-box-for-android/app/release.keystore

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle') }}

      - name: Build APK
        run: |
          cd sing-box-for-android
          chmod +x gradlew
          ./gradlew :app:assembleOtherRelease :app:assembleOtherLegacyRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.RELEASE_KEY_PASSWORD }}"
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Generate metadata
        run: |
          cd sing-box-for-android/app/build/outputs/apk/other/release

          printf '{\n    "version_code": %s,\n    "version_name": "%s"\n}\n' \
            "$VERSION_CODE" "${{ github.event.inputs.version }}" > SFA-version-metadata.json

          echo "Generated metadata:"
          cat SFA-version-metadata.json

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: |
            sing-box-for-android/app/build/outputs/apk/other/release/*.apk
            sing-box-for-android/app/build/outputs/apk/otherLegacy/release/*.apk
            sing-box-for-android/app/build/outputs/apk/other/release/SFA-version-metadata.json

  build_windows_gui:
    if: ${{ github.event.inputs.build_windows_gui == 'true' }}
    name: Build Windows GUI
    runs-on: windows-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Checkout sing-box
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ github.event.inputs.commit_hash != '' && github.event.inputs.commit_hash || format('v{0}', github.event.inputs.version) }}
          path: sing-box
          fetch-depth: 0

      - name: Checkout sing-box-for-desktop
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box-for-desktop
          ref: reF1nd-main
          path: sing-box-for-desktop
          submodules: recursive

      - name: Recreate temporary tag
        if: github.event.inputs.commit_hash != ''
        shell: pwsh
        run: |
          Set-Location sing-box
          $tag = "v${{ github.event.inputs.version }}"
          if (git rev-parse -q --verify "refs/tags/$tag") {
            git tag -d $tag
          }
          git tag $tag "${{ github.event.inputs.commit_hash }}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: i686-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          package_json_file: sing-box-for-desktop/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            sing-box-for-desktop/pnpm-lock.yaml
            sing-box-for-desktop/dashboard/pnpm-lock.yaml

      - name: Update version
        shell: pwsh
        run: |
          @{
            version = $env:DESKTOP_VERSION
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM sing-box-for-desktop/version.json
          Get-Content sing-box-for-desktop/version.json
        env:
          DESKTOP_VERSION: ${{ github.event.inputs.version }}

      - name: Setup signing
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATES_P12)) {
            throw 'WINDOWS_CERTIFICATES_P12 is not configured'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_P12_PASSWORD)) {
            throw 'WINDOWS_P12_PASSWORD is not configured'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'windows-signing.p12'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATES_P12))
          @{
            windows = @{
              certificateFile = $certificatePath
              certificatePassword = $env:WINDOWS_P12_PASSWORD
            }
          } | ConvertTo-Json -Depth 3 | Set-Content -Encoding utf8NoBOM sing-box-for-desktop/signing.local.json
        env:
          WINDOWS_CERTIFICATES_P12: ${{ secrets.WINDOWS_CERTIFICATES_P12 }}
          WINDOWS_P12_PASSWORD: ${{ secrets.WINDOWS_P12_PASSWORD }}

      - name: Install dependencies
        run: pnpm -C sing-box-for-desktop install

      - name: Build
        run: pnpm -C sing-box-for-desktop package:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare upload
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem sing-box-for-desktop/release/SFW-*.exe -File)
          if ($artifacts.Count -ne 3) {
            throw "expected 3 Windows installers, found $($artifacts.Count)"
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $artifacts.FullName dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-gui
          path: dist

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build_cli, build_android, build_windows_gui]
    if: ${{ always() && github.event.inputs.publish_release != 'none' && (github.event.inputs.build_cli == 'true' || github.event.inputs.build_android_gui == 'true' || github.event.inputs.build_windows_gui == 'true') && (github.event.inputs.build_cli != 'true' || needs.build_cli.result == 'success') && (github.event.inputs.build_android_gui != 'true' || needs.build_android.result == 'success') && (github.event.inputs.build_windows_gui != 'true' || needs.build_windows_gui.result == 'success') }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate testing-build-info.json
        run: |
          jq \
            --arg version "${{ github.event.inputs.version }}" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_id "${{ github.run_id }}" \
            '.version = $version | .built_at = $built_at | .run_id = $run_id' \
            testing-build-info.json > updated-testing-build-info.json
          mv updated-testing-build-info.json testing-build-info.json

          VERSION=$(jq -r '.version' testing-build-info.json)
          BUILT_AT=$(jq -r '.built_at' testing-build-info.json)
          RUN_ID=$(jq -r '.run_id' testing-build-info.json)

          {
            echo "## sing-box v${VERSION}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| sing-box Branch | [\`reF1nd-testing\`](https://github.com/reF1nd/sing-box/tree/reF1nd-testing) |"
            echo "| Built At | ${BUILT_AT} |"
            echo "| Run ID | [${RUN_ID}](https://github.com/${{ github.repository }}/actions/runs/${RUN_ID}) |"
          } > release-notes.md

      - name: Commit updated build-info
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add testing-build-info.json
          git commit -m "Release v${{ github.event.inputs.version }}"
          git pull --rebase
          git push

      - name: Delete existing tag and release if exists
        run: |
          TAG="v${{ github.event.inputs.version }}"
          # 删除已有 Release（若存在）
          RELEASE_ID=$(gh release view "$TAG" --json id -q '.id' 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ]; then
            gh release delete "$TAG" --yes
          fi
          # 删除已有 tag（若存在）
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            git push origin ":refs/tags/$TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect release files
        run: |
          mkdir -p release_files
          find artifacts -type f | while read -r f; do
            cp "$f" release_files/
          done

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          prerelease: ${{ github.event.inputs.publish_release == 'pre-release' }}
          body_path: release-notes.md
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Organize release files
        run: |
          mkdir -p release_files/sfa release_files/sfw release_files/android release_files/darwin release_files/windows release_files/others
          mv release_files/SFA-*.apk release_files/sfa/ 2>/dev/null || true
          mv release_files/SFW-*.exe release_files/sfw/ 2>/dev/null || true
          mv release_files/sing-box-*-android-* release_files/android/ 2>/dev/null || true
          mv release_files/sing-box-*-darwin-* release_files/darwin/ 2>/dev/null || true
          mv release_files/sing-box-*-windows-* release_files/windows/ 2>/dev/null || true
          mv release_files/sing-box-* release_files/others/ 2>/dev/null || true

      - name: Post SFA to channel
        uses: xireiki/channel-post@v2
        with: 
          chat_id: ${{ secrets.CHAT_ID }}
          bot_token: ${{ secrets.BOT_TOKEN }}
          path: release_files/sfa/*
          context: "#testing\nSFA-${{ github.event.inputs.version }}"
          parse_mode: HTML
          large_file: true
          api_id: ${{ secrets.API_ID }}
          api_hash: ${{ secrets.API_HASH }}
          method: sendFile

      - name: Post SFW to channel
        if: github.event.inputs.build_windows_gui == 'true'
        uses: xireiki/channel-post@v2
        with:
          chat_id: ${{ secrets.CHAT_ID }}
          bot_token: ${{ secrets.BOT_TOKEN }}
          path: release_files/sfw/*
          context: "#testing\nSFW-${{ github.event.inputs.version }}"
          parse_mode: HTML
          large_file: true
          api_id: ${{ secrets.API_ID }}
          api_hash: ${{ secrets.API_HASH }}
          method: sendFile

    #  - name: Kill telegram-bot-api between posts
    #    run: pkill -f telegram-bot-api || true

      - name: Post sing-box-android to channel
        uses: xireiki/channel-post@v2
        with: 
          chat_id: ${{ secrets.CHAT_ID }}
          bot_token: ${{ secrets.BOT_TOKEN }}
          path: release_files/android/*
          context: "#testing\nsing-box-${{ github.event.inputs.version }}-android"
          parse_mode: HTML
          large_file: true
          api_id: ${{ secrets.API_ID }}
          api_hash: ${{ secrets.API_HASH }}
          method: sendFile

    #  - name: Kill telegram-bot-api between posts
    #    run: pkill -f telegram-bot-api || true

      - name: Post sing-box-darwin to channel
        uses: xireiki/channel-post@v2
